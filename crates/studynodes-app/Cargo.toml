[package]
name = "studynodes-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "studynodes"
path = "src/main.rs"

[dependencies]
studynodes-graph = { path = "../studynodes-graph" }
studynodes-llm = { path = "../studynodes-llm" }
studynodes-vision = { path = "../studynodes-vision" }
rune = { git = "https://github.com/anomalyco/rune.git", rev = "01096f25021fb356b867c1b1868363467deb5143", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "01096f25021fb356b867c1b1868363467deb5143", features = ["markdown", "mermaid"] }
hayro = "0.9"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
wry = { version = "0.57", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
