[workspace]
resolver = "3"
members = [
    "crates/studynodes-graph",
    "crates/studynodes-llm",
    "crates/studynodes-vision",
    "crates/studynodes-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "2.0"
sha2 = "0.10"
tempfile = "3.10"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rstar = "0.12"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune.git", rev = "01096f25021fb356b867c1b1868363467deb5143" }
winit = { git = "https://github.com/anomalyco/rune.git", rev = "01096f25021fb356b867c1b1868363467deb5143" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune.git", rev = "01096f25021fb356b867c1b1868363467deb5143" }
parley_engine = { git = "https://github.com/anomalyco/rune.git", rev = "01096f25021fb356b867c1b1868363467deb5143" }
accesskit_windows = { git = "https://github.com/anomalyco/rune.git", rev = "01096f25021fb356b867c1b1868363467deb5143" }
accesskit_macos = { git = "https://github.com/anomalyco/rune.git", rev = "01096f25021fb356b867c1b1868363467deb5143" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
opt-level = 2

[profile.dev.package.oar-ocr]
opt-level = 3

[profile.dev.package.oar-ocr-core]
opt-level = 3

[profile.dev.package.imageproc]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.hayro]
opt-level = 3

[profile.dev.package.hayro-interpret]
opt-level = 3

[profile.dev.package.hayro-syntax]
opt-level = 3

[profile.dev.package.hayro-font]
opt-level = 3

[profile.dev.package.hayro-cmap]
opt-level = 3

[profile.dev.package.hayro-jpeg2000]
opt-level = 3

[profile.dev.package.hayro-jbig2]
opt-level = 3

[profile.dev.package.hayro-ccitt]
opt-level = 3

[profile.dev.package.hayro-postscript]
opt-level = 3

[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.vello_common]
opt-level = 3

[profile.dev.package.kurbo]
opt-level = 3
